<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infographic: Memorial Day Sides</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0b132b; /* Midnight Blue Background */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        /* Premium Infographic Header */
        header {
            text-align: center;
            padding: 24px 10px;
            width: 100%;
            background: linear-gradient(135deg, #1c2541 0%, #0b132b 100%);
            box-shadow: 0 4px 25px rgba(0,0,0,0.6);
            z-index: 10;
            border-bottom: 2px solid #1c2541;
        }
        header h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #ff4d4d, #ffffff, #3385ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        header p {
            margin: 6px 0 0 0;
            color: #a5a9b4;
            font-size: 1rem;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Map Workspace */
        #map-container {
            position: relative;
            width: 95vw;
            height: 76vh;
            margin-top: 20px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            border: 2px solid #1c2541;
        }
        #map {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1c2541 0%, #0b132b 100%) !important;
        }

        /* Custom Visual Inset Box Overlay for AK/HI */
        .inset-box {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 195px;
            height: 145px;
            border: 2px dashed #3a506b;
            border-radius: 8px;
            pointer-events: none;
            z-index: 1000;
            background: rgba(28, 37, 65, 0.2);
        }
        .inset-label {
            position: absolute;
            bottom: 170px;
            left: 25px;
            font-size: 0.75rem;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 1000;
        }

        /* Hover Detail Card */
        .info {
            padding: 15px 20px;
            font-size: 14px;
            background: #1c2541;
            border: 2px solid #3a506b;
            border-radius: 12px;
            color: #ffffff;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            min-width: 220px;
        }
        .info h4 {
            margin: 0 0 6px 0;
            color: #ff4d4d;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
        }
        .info .state-name {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .info .dish-tag {
            font-size: 0.8rem;
            color: #a5a9b4;
            margin-bottom: 2px;
        }
        .info .dish-name {
            color: #5bc0be;
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* Legend Layout */
        .legend {
            background: #1c2541;
            border: 2px solid #3a506b;
            padding: 16px;
            border-radius: 12px;
            color: #ffffff;
            line-height: 26px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        .legend strong {
            display: block;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            color: #a5a9b4;
            border-bottom: 1px solid #3a506b;
            padding-bottom: 4px;
        }
        
        /* CSS Legend Pattern Swatches */
        .legend-color {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 12px;
            margin-top: 4px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .swatch-salad { background-color: #d90429; }
        .swatch-chips { background-color: #edf2f4; }
        .swatch-other { background-color: #00b4d8; }
        .swatch-salad-other {
            background: linear-gradient(45deg, #d90429 25%, #00b4d8 25%, #00b4d8 50%, #d90429 50%, #d90429 75%, #00b4d8 75%, #00b4d8 100%);
            background-size: 8px 8px;
        }
        .swatch-chips-other {
            background: linear-gradient(45deg, #edf2f4 25%, #00b4d8 25%, #00b4d8 50%, #edf2f4 50%, #edf2f4 75%, #00b4d8 75%, #00b4d8 100%);
            background-size: 8px 8px;
        }
        .swatch-salad-chips {
            background: linear-gradient(45deg, #d90429 25%, #edf2f4 25%, #edf2f4 50%, #d90429 50%, #d90429 75%, #edf2f4 75%, #edf2f4 100%);
            background-size: 8px 8px;
        }
        .swatch-all {
            background: linear-gradient(45deg, #d90429 16.6%, #edf2f4 16.6%, #edf2f4 33.3%, #00b4d8 33.3%, #00b4d8 50%, #d90429 50%, #d90429 66.6%, #edf2f4 66.6%, #edf2f4 83.3%, #00b4d8 83.3%);
            background-size: 12px 12px;
        }

        /* Pure CSS Pattern engine classes to bypass the SVG cache block entirely */
        .pattern-salad-other { fill: #d90429 !important; filter: drop-shadow(0px 0px 1px #00b4d8); stroke-dasharray: 4; stroke: #00b4d8 !important; stroke-width: 3px !important;}
        .pattern-chips-other { fill: #edf2f4 !important; filter: drop-shadow(0px 0px 1px #00b4d8); stroke-dasharray: 4; stroke: #00b4d8 !important; stroke-width: 3px !important;}
        .pattern-salad-chips { fill: #d90429 !important; filter: drop-shadow(0px 0px 1px #edf2f4); stroke-dasharray: 4; stroke: #edf2f4 !important; stroke-width: 3px !important;}
        .pattern-all { fill: #d90429 !important; filter: drop-shadow(0px 0px 1px #edf2f4); stroke-dasharray: 3; stroke: #00b4d8 !important; stroke-width: 4px !important;}
    </style>
</head>
<body>

    <header>
        <h1>The Memorial Day Menu</h1>
        <p>National Side Dish Map • Red, White, &amp; Blue Edition</p>
    </header>

    <div id="map-container">
        <div class="inset-label">AK &amp; HI Inset</div>
        <div class="inset-box"></div>
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Exact dataset categorization derived directly from your file
        const stateCategories = {
            "Alabama": "Chips Only", "Alaska": "Salad + Other", "Arizona": "Salad Only",
            "Arkansas": "Salad + Chips + Other", "California": "Salad Only", "Colorado": "Salad Only",
            "Connecticut": "Salad Only", "Delaware": "Salad Only", "Florida": "Salad Only",
            "Georgia": "Salad Only", "Hawaii": "Salad Only", "Idaho": "Salad + Chips + Other",
            "Illinois": "Salad Only", "Indiana": "Chips Only", "Iowa": "Other Only",
            "Kansas": "Salad + Chips", "Kentucky": "Chips Only", "Louisiana": "Salad Only",
            "Maine": "Salad + Chips + Other", "Maryland": "Salad Only", "Massachusetts": "Salad Only",
            "Michigan": "Salad + Chips + Other", "Minnesota": "Salad + Other", "Mississippi": "Salad + Chips",
            "Missouri": "Chips Only", "Montana": "Salad + Chips + Other", "Nebraska": "Other Only",
            "Nevada": "Salad Only", "New Hampshire": "Chips Only", "New Jersey": "Salad Only",
            "New Mexico": "Salad Only", "New York": "Salad Only", "North Carolina": "Salad Only",
            "North Dakota": "Other Only", "Ohio": "Chips Only", "Oklahoma": "Chips + Other",
            "Oregon": "Salad Only", "Pennsylvania": "Salad + Other", "Rhode Island": "Salad Only",
            "South Carolina": "Salad Only", "South Dakota": "Other Only", "Tennessee": "Salad + Chips",
            "Texas": "Salad Only", "Utah": "Salad Only", "Vermont": "Other Only", "Virginia": "Salad Only",
            "Washington": "Salad Only", "West Virginia": "Chips + Other", "Wisconsin": "Other Only", "Wyoming": "Salad Only"
        };

        const stateDishes = {
            "Alabama": "Potato Chips", "Alaska": "Macaroni Salad, Salad", "Arizona": "Salad",
            "Arkansas": "Nachos, Potato Chips, Salad", "California": "Salad", "Colorado": "Salad",
            "Connecticut": "Salad", "Delaware": "Salad", "Florida": "Salad", "Georgia": "Salad",
            "Hawaii": "Salad", "Idaho": "Asparagus, Cowboy Caviar, Potato Chips, Salad",
            "Illinois": "Salad", "Indiana": "Potato Chips", "Iowa": "Asparagus",
            "Kansas": "Potato Chips, Salad", "Kentucky": "Potato Chips", "Louisiana": "Salad",
            "Maine": "Buffalo Chicken Dip, Potato Chips, Salad", "Maryland": "Salad",
            "Massachusetts": "Salad", "Michigan": "Asparagus, Potato Chips, Salad",
            "Minnesota": "Asparagus, Salad", "Mississippi": "Potato Chips, Salad",
            "Missouri": "Potato Chips", "Montana": "Cowboy Caviar, Elote, Macaroni Salad, Potato Chips, Salad",
            "Nebraska": "Asparagus", "Nevada": "Salad", "New Hampshire": "Potato Chips",
            "New Jersey": "Salad", "New Mexico": "Salad", "New York": "Salad",
            "North Carolina": "Salad", "North Dakota": "Cowboy Caviar", "Ohio": "Potato Chips",
            "Oklahoma": "Elote, Potato Chips", "Oregon": "Salad", "Pennsylvania": "Buffalo Chicken Dip, Salad",
            "Rhode Island": "Salad", "South Carolina": "Salad", "South Dakota": "Asparagus",
            "Tennessee": "Potato Chips, Salad", "Texas": "Salad", "Utah": "Salad",
            "Vermont": "Asparagus, Macaroni Salad, Potato Salad", "Virginia": "Salad",
            "Washington": "Salad", "West Virginia": "Buffalo Chicken Dip, Potato Chips",
            "Wisconsin": "Asparagus", "Wyoming": "Salad"
        };

        // Initialize map
        const map = L.map('map', {
            zoomControl: true,
            attributionControl: false
        }).setView([37.8, -96], 4);

        // Solid Color Selector (Fallbacks)
        function getBaseColor(stateName) {
            const cat = stateCategories[stateName];
            if (cat === "Salad Only") return '#d90429';       // Red
            if (cat === "Chips Only") return '#edf2f4';       // White
            if (cat === "Other Only") return '#00b4d8';       // Blue
            if (cat === "Salad + Other") return '#d90429';
            if (cat === "Chips + Other") return '#edf2f4';
            if (cat === "Salad + Chips") return '#d90429';
            if (cat === "Salad + Chips + Other") return '#d90429';
            return '#1c2541';
        }

        function styleFeature(feature) {
            return {
                fillColor: getBaseColor(feature.properties.name),
                weight: 1.5,
                opacity: 1,
                color: '#0b132b', 
                fillOpacity: 1.0
            };
        }

        // Card Panel Overlay
        const info = L.control({position: 'topright'});
        info.onAdd = function () {
            this._div = L.DomUtil.create('div', 'info');
            this.update();
            return this._div;
        };
        info.update = function (props) {
            this._div.innerHTML = '<h4>Menu Tracking</h4>' + (props ?
                `<div class="state-name">${props.name}</div>
                 <div class="dish-tag">Top #1 Memorial Day Sides:</div>
                 <div class="dish-name">🇺🇸 ${stateDishes[props.name] || 'No Records'}</div>` : 
                '<span style="color:#6c757d">Hover over a state</span>');
        };
        info.addTo(map);

        function highlightFeature(e) {
            const layer = e.target;
            layer.setStyle({ weight: 3, color: '#ffffff' });
            layer.bringToFront();
            info.update(layer.feature.properties);
        }

        let geojson;
        function resetHighlight(e) {
            geojson.resetStyle(e.target);
            info.update();
        }

        function onEachFeature(feature, layer) {
            layer.on({ mouseover: highlightFeature, mouseout: resetHighlight });
        }

        function transformGeoJSONCoords(coords, type, transformFn) {
            if (type === "Point") return transformFn(coords);
            if (type === "LineString" || type === "MultiPoint") return coords.map(transformFn);
            if (type === "Polygon" || type === "MultiLineString") return coords.map(r => r.map(transformFn));
            if (type === "MultiPolygon") return coords.map(p => p.map(r => r.map(transformFn)));
            return coords;
        }

        // Fetch polygons and manually safely class them via native DOM loops
        fetch('https://raw.githubusercontent.com/PublicaMundi/MappingAPI/master/data/geojson/us-states.json')
            .then(res => res.json())
            .then(data => {
                data.features.forEach(feature => {
                    const name = feature.properties.name;
                    if (name === "Alaska") {
                        feature.geometry.coordinates = transformGeoJSONCoords(feature.geometry.coordinates, feature.geometry.type, c => {
                            return [(c[0] + 149) * 0.38 - 118.5, (c[1] - 63) * 0.38 + 25.0];
                        });
                    } else if (name === "Hawaii") {
                        feature.geometry.coordinates = transformGeoJSONCoords(feature.geometry.coordinates, feature.geometry.type, c => {
                            return [(c[0] + 158) * 1.1 - 112.5, (c[1] - 20) * 1.1 + 22.2];
                        });
                    }
                });

                geojson = L.geoJson(data, {
                    style: styleFeature,
                    onEachFeature: onEachFeature
                }).addTo(map);

                // Safe Native CSS Pattern Mapping Loop (Bypasses caching rules)
                geojson.eachLayer(layer => {
                    const name = layer.feature.properties.name;
                    const cat = stateCategories[name];
                    const element = layer._path;
                    
                    if (element) {
                        if (cat === "Salad + Other") element.classList.add("pattern-salad-other");
                        else if (cat === "Chips + Other") element.classList.add("pattern-chips-other");
                        else if (cat === "Salad + Chips") element.classList.add("pattern-salad-chips");
                        else if (cat === "Salad + Chips + Other") element.classList.add("pattern-all");
                    }
                });
            });

        // Legend panel
        const legend = L.control({position: 'bottomright'});
        legend.onAdd = function () {
            const div = L.DomUtil.create('div', 'legend');
            div.innerHTML += '<strong>Color &amp; Striping Key</strong>';
            div.innerHTML += '<div><i class="legend-color swatch-salad"></i> Red: Salad Only</div>';
            div.innerHTML += '<div><i class="legend-color swatch-chips"></i> White: Potato Chips Only</div>';
            div.innerHTML += '<div><i class="legend-color swatch-other"></i> Blue: Other Only (Dip, Veggies)</div>';
            div.innerHTML += '<div><i class="legend-color swatch-salad-other"></i> Stripes: Salad + Other</div>';
            div.innerHTML += '<div><i class="legend-color swatch-chips-other"></i> Stripes: Chips + Other</div>';
            div.innerHTML += '<div><i class="legend-color swatch-salad-chips"></i> Stripes: Salad + Chips</div>';
            div.innerHTML += '<div><i class="legend-color swatch-all"></i> Stripes: All Categories Tied</div>';
            return div;
        };
        legend.addTo(map);
    </script>
</body>
</html>
