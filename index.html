<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infographic: Memorial Day Sides</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0b132b; /* Midnight Blue Background */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        /* Premium Infographic Header */
        header {
            text-align: center;
            padding: 24px 10px;
            width: 100%;
            background: linear-gradient(135deg, #1c2541 0%, #0b132b 100%);
            box-shadow: 0 4px 25px rgba(0,0,0,0.6);
            z-index: 10;
            border-bottom: 2px solid #1c2541;
        }
        header h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #ff4d4d, #ffffff, #3385ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        header p {
            margin: 6px 0 0 0;
            color: #a5a9b4;
            font-size: 1rem;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Map Workspace */
        #map-container {
            position: relative;
            width: 95vw;
            height: 76vh;
            margin-top: 20px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            border: 2px solid #1c2541;
        }
        #map {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1c2541 0%, #0b132b 100%) !important;
        }

        /* Custom Visual Inset Box Overlay for AK/HI */
        .inset-box {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 195px;
            height: 145px;
            border: 2px dashed #3a506b;
            border-radius: 8px;
            pointer-events: none;
            z-index: 1000;
            background: rgba(28, 37, 65, 0.2);
        }

        /* Hover Detail Card */
        .info {
            padding: 15px 20px;
            font-size: 14px;
            background: #1c2541;
            border: 2px solid #3a506b;
            border-radius: 12px;
            color: #ffffff;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            min-width: 220px;
        }
        .info h4 {
            margin: 0 0 6px 0;
            color: #ff4d4d;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
        }
        .info .state-name {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .info .dish-tag {
            font-size: 0.8rem;
            color: #a5a9b4;
            margin-bottom: 2px;
        }
        .info .dish-name {
            color: #5bc0be;
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* Legend Layout */
        .legend {
            background: #1c2541;
            border: 2px solid #3a506b;
            padding: 16px;
            border-radius: 12px;
            color: #ffffff;
            line-height: 26px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        .legend strong {
            display: block;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            color: #a5a9b4;
            border-bottom: 1px solid #3a506b;
            padding-bottom: 4px;
        }
        
        /* CSS Legend Pattern Swatches matching SVG patterns */
        .legend-color {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 12px;
            margin-top: 4px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .swatch-salad { background-color: #d90429; }
        .swatch-chips { background-color: #edf2f4; }
        .swatch-other { background-color: #00b4d8; }
        .swatch-salad-other {
            background: linear-gradient(45deg, #d90429 25%, #00b4d8 25%, #00b4d8 50%, #d90429 50%, #d90429 75%, #00b4d8 75%, #00b4d8 100%);
            background-size: 8px 8px;
        }
        .swatch-chips-other {
            background: linear-gradient(45deg, #edf2f4 25%, #00b4d8 25%, #00b4d8 50%, #edf2f4 50%, #edf2f4 75%, #00b4d8 75%, #00b4d8 100%);
            background-size: 8px 8px;
        }
        .swatch-salad-chips {
            background: linear-gradient(45deg, #d90429 25%, #edf2f4 25%, #edf2f4 50%, #d90429 50%, #d90429 75%, #edf2f4 75%, #edf2f4 100%);
            background-size: 8px 8px;
        }
        .swatch-all {
            background: linear-gradient(45deg, #d90429 16.6%, #edf2f4 16.6%, #edf2f4 33.3%, #00b4d8 33.3%, #00b4d8 50%, #d90429 50%, #d90429 66.6%, #edf2f4 66.6%, #edf2f4 83.3%, #00b4d8 83.3%);
            background-size: 12px 12px;
        }
    </style>
</head>
<body>

    <header>
        <h1>The Memorial Day Menu</h1>
        <p>National Side Dish Map • Red, White, &amp; Blue Edition</p>
    </header>

    <div id="map-container">
        <div class="inset-box"></div>
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Dual-Key Data Mapping Layer (Matches BOTH full names and postal IDs to prevent gaps)
        const categoriesMapping = {
            "Alabama": "Chips Only", "AL": "Chips Only",
            "Alaska": "Salad + Other", "AK": "Salad + Other",
            "Arizona": "Salad Only", "AZ": "Salad Only",
            "Arkansas": "Salad + Chips + Other", "AR": "Salad + Chips + Other",
            "California": "Salad Only", "CA": "Salad Only",
            "Colorado": "Salad Only", "CO": "Salad Only",
            "Connecticut": "Salad Only", "CT": "Salad Only",
            "Delaware": "Salad Only", "DE": "Salad Only",
            "Florida": "Salad Only", "FL": "Salad Only",
            "Georgia": "Salad Only", "GA": "Salad Only",
            "Hawaii": "Salad Only", "HI": "Salad Only",
            "Idaho": "Salad + Chips + Other", "ID": "Salad + Chips + Other",
            "Illinois": "Salad Only", "IL": "Salad Only",
            "Indiana": "Chips Only", "IN": "Chips Only",
            "Iowa": "Other Only", "IA": "Other Only",
            "Kansas": "Salad + Chips", "KS": "Salad + Chips",
            "Kentucky": "Chips Only", "KY": "Chips Only",
            "Louisiana": "Salad Only", "LA": "Salad Only",
            "Maine": "Salad + Chips + Other", "ME": "Salad + Chips + Other",
            "Maryland": "Salad Only", "MD": "Salad Only",
            "Massachusetts": "Salad Only", "MA": "Salad Only",
            "Michigan": "Salad + Chips + Other", "MI": "Salad + Chips + Other",
            "Minnesota": "Salad + Other", "MN": "Salad + Other",
            "Mississippi": "Salad + Chips", "MS": "Salad + Chips",
            "Missouri": "Chips Only", "MO": "Chips Only",
            "Montana": "Salad + Chips + Other", "MT": "Salad + Chips + Other",
            "Nebraska": "Other Only", "NE": "Other Only",
            "Nevada": "Salad Only", "NV": "Salad Only",
            "New Hampshire": "Chips Only", "NH": "Chips Only",
            "New Jersey": "Salad Only", "NJ": "Salad Only",
            "New Mexico": "Salad Only", "NM": "Salad Only",
            "New York": "Salad Only", "NY": "Salad Only",
            "North Carolina": "Salad Only", "NC": "Salad Only",
            "North Dakota": "Other Only", "ND": "Other Only",
            "Ohio": "Chips Only", "OH": "Chips Only",
            "Oklahoma": "Chips + Other", "OK": "Chips + Other",
            "Oregon": "Salad Only", "OR": "Salad Only",
            "Pennsylvania": "Salad + Other", "PA": "Salad + Other",
            "Rhode Island": "Salad Only", "RI": "Salad Only",
            "South Carolina": "Salad Only", "SC": "Salad Only",
            "South Dakota": "Other Only", "SD": "Other Only",
            "Tennessee": "Salad + Chips", "TN": "Salad + Chips",
            "Texas": "Salad Only", "TX": "Salad Only",
            "Utah": "Salad Only", "UT": "Salad Only",
            "Vermont": "Other Only", "VT": "Other Only",
            "Virginia": "Salad Only", "VA": "Salad Only",
            "Washington": "Salad Only", "WA": "Salad Only",
            "West Virginia": "Chips + Other", "WV": "Chips + Other",
            "Wisconsin": "Other Only", "WI": "Other Only",
            "Wyoming": "Salad Only", "WY": "Salad Only"
        };

        const dishesMapping = {
            "Alabama": "Potato Chips", "AL": "Potato Chips",
            "Alaska": "Macaroni Salad, Salad", "AK": "Macaroni Salad, Salad",
            "Arizona": "Salad", "AZ": "Salad",
            "Arkansas": "Nachos, Potato Chips, Salad", "AR": "Nachos, Potato Chips, Salad",
            "California": "Salad", "CA": "Salad",
            "Colorado": "Salad", "CO": "Salad",
            "Connecticut": "Salad", "CT": "Salad",
            "Delaware": "Salad", "DE": "Salad",
            "Florida": "Salad", "FL": "Salad",
            "Georgia": "Salad", "GA": "Salad",
            "Hawaii": "Salad", "HI": "Salad",
            "Idaho": "Asparagus, Cowboy Caviar, Potato Chips, Salad", "ID": "Asparagus, Cowboy Caviar, Potato Chips, Salad",
            "Illinois": "Salad", "IL": "Salad",
            "Indiana": "Potato Chips", "IN": "Potato Chips",
            "Iowa": "Asparagus", "IA": "Asparagus",
            "Kansas": "Potato Chips, Salad", "KS": "Potato Chips, Salad",
            "Kentucky": "Potato Chips", "KY": "Potato Chips",
            "Louisiana": "Salad", "LA": "Salad",
            "Maine": "Buffalo Chicken Dip, Potato Chips, Salad", "ME": "Buffalo Chicken Dip, Potato Chips, Salad",
            "Maryland": "Salad", "MD": "Salad",
            "Massachusetts": "Salad", "MA": "Salad",
            "Michigan": "Asparagus, Potato Chips, Salad", "MI": "Asparagus, Potato Chips, Salad",
            "Minnesota": "Asparagus, Salad", "MN": "Asparagus, Salad",
            "Mississippi": "Potato Chips, Salad", "MS": "Potato Chips, Salad",
            "Missouri": "Potato Chips", "MO": "Potato Chips",
            "Montana": "Cowboy Caviar, Elote, Macaroni Salad, Potato Chips, Salad", "MT": "Cowboy Caviar, Elote, Macaroni Salad, Potato Chips, Salad",
            "Nebraska": "Asparagus", "NE": "Asparagus",
            "Nevada": "Salad", "NV": "Salad",
            "New Hampshire": "Potato Chips", "NH": "Potato Chips",
            "New Jersey": "Salad", "NJ": "Salad",
            "New Mexico": "Salad", "NM": "Salad",
            "New York": "Salad", "NY": "Salad",
            "North Carolina": "Salad", "NC": "Salad",
            "North Dakota": "Cowboy Caviar", "ND": "Cowboy Caviar",
            "Ohio": "Potato Chips", "OH": "Potato Chips",
            "Oklahoma": "Elote, Potato Chips", "OK": "Elote, Potato Chips",
            "Oregon": "Salad", "OR": "Salad",
            "Pennsylvania": "Buffalo Chicken Dip, Salad", "PA": "Buffalo Chicken Dip, Salad",
            "Rhode Island": "Salad", "RI": "Salad",
            "South Carolina": "Salad", "SC": "Salad",
            "South Dakota": "Asparagus", "SD": "Asparagus",
            "Tennessee": "Potato Chips, Salad", "TN": "Potato Chips, Salad",
            "Texas": "Salad", "TX": "Salad",
            "Utah": "Salad", "UT": "Salad",
            "Vermont": "Asparagus, Macaroni Salad, Potato Salad", "VT": "Asparagus, Macaroni Salad, Potato Salad",
            "Virginia": "Salad", "VA": "Salad",
            "Washington": "Salad", "WA": "Salad",
            "West Virginia": "Buffalo Chicken Dip, Potato Chips", "WV": "Buffalo Chicken Dip, Potato Chips",
            "Wisconsin": "Asparagus", "WI": "Asparagus",
            "Wyoming": "Salad", "WY": "Salad"
        };

        // Initialize Map view core
        const map = L.map('map', {
            zoomControl: true,
            attributionControl: false
        }).setView([37.8, -96], 4);

        // Force explicit SVG core rendering vector canvas
        const svgRenderer = L.svg({ padding: 0.5 }).addTo(map);
        const defs = svgRenderer._defs;

        // Vector geometric generator writing pure inline patterns
        function makeSVGPattern(id, colors) {
            const p = document.createElementNS("http://www.w3.org/2000/svg", "pattern");
            p.setAttribute("id", id); p.setAttribute("width", "20"); p.setAttribute("height", "20");
            p.setAttribute("patternUnits", "userSpaceOnUse"); p.setAttribute("patternTransform", "rotate(45)");
            const step = 20 / colors.length;
            colors.forEach((col, idx) => {
                const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                r.setAttribute("x", (idx * step).toString()); r.setAttribute("y", "0");
                r.setAttribute("width", step.toString()); r.setAttribute("height", "20");
                r.setAttribute("fill", col); p.appendChild(r);
            });
            defs.appendChild(p);
        }

        makeSVGPattern("pat-salad-other", ["#d90429", "#00b4d8"]);
        makeSVGPattern("pat-chips-other", ["#edf2f4", "#00b4d8"]);
        makeSVGPattern("pat-salad-chips", ["#d90429", "#edf2f4"]);
        makeSVGPattern("pat-all", ["#d90429", "#edf2f4", "#00b4d8"]);

        // Safe style locator using dual keys fallback logic
        function getFillStyle(feat) {
            const nameKey = feat.properties ? feat.properties.name : null;
            const idKey = feat.id || null;
            const cat = categoriesMapping[nameKey] || categoriesMapping[idKey];
            
            if (cat === "Salad Only") return '#d90429';       // Red
            if (cat === "Chips Only") return '#edf2f4';       // White
            if (cat === "Other Only") return '#00b4d8';       // Blue
            if (cat === "Salad + Other") return 'url(#pat-salad-other)';
            if (cat === "Chips + Other") return 'url(#pat-chips-other)';
            if (cat === "Salad + Chips") return 'url(#pat-salad-chips)';
            if (cat === "Salad + Chips + Other") return 'url(#pat-all)';
            return '#1c2541'; 
        }

        function styleFeature(feature) {
            return {
                fillColor: getFillStyle(feature),
                weight: 1.5,
                opacity: 1,
                color: '#0b132b', 
                fillOpacity: 1.0,
                renderer: svgRenderer
            };
        }

        // Dashboard overlay control metrics card
        const info = L.control({position: 'topright'});
        info.onAdd = function () {
            this._div = L.DomUtil.create('div', 'info');
            this.update();
            return this._div;
        };
        info.update = function (feature) {
            if (feature) {
                const name = feature.properties ? feature.properties.name : '';
                const id = feature.id || '';
                const finalName = name || id;
                const dishText = dishesMapping[name] || dishesMapping[id] || 'No Records';
                this._div.innerHTML = `<h4>Menu Tracking</h4>
                    <div class="state-name">${finalName}</div>
                    <div class="dish-tag">Top #1 Memorial Day Sides:</div>
                    <div class="dish-name">🇺🇸 ${dishText}</div>`;
            } else {
                this._div.innerHTML = '<h4>Menu Tracking</h4><span style="color:#6c757d">Hover over a state</span>';
            }
        };
        info.addTo(map);

        function highlightFeature(e) {
            const layer = e.target;
            layer.setStyle({ weight: 3, color: '#ffffff' });
            layer.bringToFront();
            info.update(layer.feature);
        }

        let geojson;
        function resetHighlight(e) {
            geojson.resetStyle(e.target);
            info.update();
        }

        function onEachFeature(feature, layer) {
            layer.on({ mouseover: highlightFeature, mouseout: resetHighlight });
        }

        function transformGeoJSONCoords(coords, type, transformFn) {
            if (type === "Point") return transformFn(coords);
            if (type === "LineString" || type === "MultiPoint") return coords.map(transformFn);
            if (type === "Polygon" || type === "MultiLineString") return coords.map(r => r.map(transformFn));
            if (type === "MultiPolygon") return coords.map(p => p.map(r => r.map(transformFn)));
            return coords;
        }

        // Core data query loading maps boundaries 
        fetch('https://raw.githubusercontent.com/PublicaMundi/MappingAPI/master/data/geojson/us-states.json')
            .then(res => res.json())
            .then(data => {
                data.features.forEach(feature => {
                    const name = feature.properties ? feature.properties.name : '';
                    const id = feature.id || '';
                    
                    // Reposition Alaska safely into the custom frame corner using both keys
                    if (name === "Alaska" || id === "AK") {
                        feature.geometry.coordinates = transformGeoJSONCoords(feature.geometry.coordinates, feature.geometry.type, c => {
                            return [(c[0] + 149) * 0.38 - 118.5, (c[1] - 63) * 0.38 + 25.0];
                        });
                    } 
                    // Reposition Hawaii right next to Alaska inside the inset
                    else if (name === "Hawaii" || id === "HI") {
                        feature.geometry.coordinates = transformGeoJSONCoords(feature.geometry.coordinates, feature.geometry.type, c => {
                            return [(c[0] + 158) * 1.1 - 112.5, (c[1] - 20) * 1.1 + 22.2];
                        });
                    }
                });

                geojson = L.geoJson(data, {
                    style: styleFeature,
                    onEachFeature: onEachFeature
                }).addTo(map);
            });

        // Legend control card construction
        const legend = L.control({position: 'bottomright'});
        legend.onAdd = function () {
            const div = L.DomUtil.create('div', 'legend');
            div.innerHTML += '<strong>Color &amp; Striping Key</strong>';
            div.innerHTML += '<div><i class="legend-color swatch-salad"></i> Red: Salad Only</div>';
            div.innerHTML += '<div><i class="legend-color swatch-chips"></i> White: Potato Chips Only</div>';
            div.innerHTML += '<div><i class="legend-color swatch-other"></i> Blue: Other Only (Dip, Veggies)</div>';
            div.innerHTML += '<div><i class="legend-color swatch-salad-other"></i> Stripes: Salad + Other</div>';
            div.innerHTML += '<div><i class="legend-color swatch-chips-other"></i> Stripes: Chips + Other</div>';
            div.innerHTML += '<div><i class="legend-color swatch-salad-chips"></i> Stripes: Salad + Chips</div>';
            div.innerHTML += '<div><i class="legend-color swatch-all"></i> Stripes: All Categories Tied</div>';
            return div;
        };
        legend.addTo(map);
    </script>
</body>
</html>
